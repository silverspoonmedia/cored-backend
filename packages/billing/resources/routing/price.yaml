# rules: longest_settlement_for_lower_fee + lowest_fee
# excluded: credit_card, otc, direct_debit, cod, escrow, paylater

channels:
  va:
    type: dual
    primary:
      pg: ipaymu
      settlement: H+4
      fee: 3500
    fallback:
      pg: midtrans
      settlement: H+2
      fee: 4000
    single_overrides:
      seabank: midtrans
      saqu: midtrans
      artha_graha: ipaymu
      muamalat: ipaymu

  qris:
    type: dual
    primary:
      pg: midtrans          # 0.7% VAT-incl, H+2
      settlement: H+2
      fee: "0.7%"
    fallback:
      pg: ipaymu
      settlement: H+2       # JANGAN H+0
      fee: "0.7%"
    avoid:
      - ipaymu_h0           # 0.7% + 1.8%

  gopay:
    type: single
    pg: midtrans
    mode: direct
    settlement: H+2
    fee: "2%"
    cheap_alt: qris         # 0.7% jika UX QR OK

  ovo:
    type: single
    pg: midtrans
    settlement: H+2
    fee: "1.5%"
    cheap_alt: qris

  dana:
    type: single
    pg: midtrans
    settlement: H+2
    fee: "1.5%"
    cheap_alt: qris

  shopeepay:
    type: single
    pg: midtrans
    settlement: H+2
    fee: "2%"
    cheap_alt: qris

  linkaja:
    type: dual               # hanya via QRIS
    primary: qris            # midtrans atau ipaymu H+2
    fee: "0.7%"