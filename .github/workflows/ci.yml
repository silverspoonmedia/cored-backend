name: CI

# The localization guards are cross-repo by design: they compare the backend packs
# (`lang/{locale}/**`, `lang/{locale}.json`) with the SPA packs
# (`monolith-vue-workers/src/i18n/locales/*.json`). That means this workflow has to
# check out **two** repositories, and the sibling has to land at
# `../monolith-vue-workers` relative to this one — that is the path the guards resolve
# (`locale_scan_spa_root()`), and the path `LocaleGuardTest` asserts against.
#
# Both repos are private. `GITHUB_TOKEN` is scoped to the repo running the workflow and
# cannot read the sibling, so the sibling checkout (and the Composer VCS install of
# `silverspoonmedia/pdf-tools`) needs a token with read access to the org's repos.
# Set `SPA_REPO_TOKEN` in repository secrets; it falls back to `GITHUB_TOKEN` so the
# workflow still runs (and fails loudly on the checkout, not silently on the guards)
# when the secret is absent.

on:
  push:
    branches: [main, master, main-sandbox, main-staging]
  pull_request:

jobs:
  locale:
    name: Localization guards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: monolith

      - name: Checkout SPA sibling (required by the cross-repo guards)
        uses: actions/checkout@v4
        with:
          repository: silverspoonmedia/monolith-vue-workers
          path: monolith-vue-workers
          token: ${{ secrets.SPA_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, bcmath, gd, zip, exif, curl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: monolith/vendor
          key: composer-${{ hashFiles('monolith/composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        working-directory: monolith
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.SPA_REPO_TOKEN || secrets.GITHUB_TOKEN }}"}}'
        run: composer install --prefer-dist --no-interaction --no-progress

      # `LocaleGuardTest` shells out to every guard in `scripts/` and asserts exit 0, so
      # this one command is the gate. `LocaleParityTest` and `LocaleUsageTest` run under
      # the same filter.
      - name: Localization tests (incl. guard gate)
        working-directory: monolith
        run: php artisan test --filter=Locale

      # Run the guards directly as well: their output names the offending key and
      # locale, which the aggregated PHPUnit failure does not surface in the job log.
      - name: Guards (direct run, for readable findings)
        working-directory: monolith
        run: |
          php scripts/locale-prose-scan.php
          php scripts/locale-rawkey-scan.php
          php scripts/locale-dynamic-key-check.php
          php scripts/locale-pack-parity.php
          php scripts/locale-flat-pack-parity.php
          php scripts/locale-glossary-scan.php
