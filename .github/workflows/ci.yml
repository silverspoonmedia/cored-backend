name: CI

# Two gates, both sibling-free — neither job carries credentials or checks out
# `monolith-vue-workers`:
#
#   `locale`  — the localization guards.
#   `backend` — Pint, PHPStan level 5, and the backend test suite (`php artisan test`),
#               which is where the domain suites live. Before these steps existed,
#               `ci.yml` ran only `--filter=Locale`, so a change that broke
#               `tests/Domain/**` could merge green: a single product domain alone is
#               60+ feature test files that never executed on the runner. Style and
#               types had no gate at all — a drift landed in the next commit.
#
# An earlier version of `locale` checked out `monolith-vue-workers` as a sibling so
# the four cross-repo guards (`locale-prose-scan`, `locale-rawkey-scan`,
# `locale-pack-parity`, `locale-glossary-scan`) could run here too. It never worked:
# the sibling is private, `GITHUB_TOKEN` is scoped to the repo running the workflow,
# and the checkout step failed `Not Found` before any test executed. Reading the
# sibling needs a fine-grained PAT, and the guards still are not the whole story —
# see the coverage table in `docs/platform/localization.md`. Those four now run from
# a machine that has both repos, via `php artisan test --filter=Locale`.
#
# What runs in `locale` is the sibling-free half: key/placeholder parity across
# locales, literal call-site resolution, the flat pack against its PHP owners, the
# runtime-assembled keys, and the orphaned `// curated at` flags left behind by a
# deleted key. `LocaleGuardTest` reports the four cross-repo guards as
# skipped when the sibling is absent, so a green run cannot be mistaken for "all seven
# guards ran". The `backend` job reruns those locale tests as part of the whole suite;
# the narrow job stays because its direct guard runs name the offending key and locale
# in the job log, which an aggregated PHPUnit failure does not.
#
# The docs guard sits in the same position, for the same reason. The `backend` job
# covers it through `DocsStructureGuardTest` (`--repo=backend`), which reaches every
# doc, rule and root README in this repo. Links that leave this repo cannot be resolved
# here, so both guards report them as `unverified` rather than broken, and
# `scripts/docs-cross-repo-links.php` is the fail-closed check for a machine that has
# both checkouts. The behaviour is still covered on the runner: `DocsCrossRepoLinkTest`
# drives the same library against a two-repo fixture. Coverage table:
# `docs/platform/reference-tooling.md` § the docs gates.

on:
  push:
    branches: [main, master, main-sandbox, main-staging]
  pull_request:

jobs:
  locale:
    name: Localization guards (sibling-free)
    runs-on: ubuntu-latest

    # `composer install` is not a passive download here: `post-autoload-dump` runs
    # `artisan package:discover`, which boots every service provider. One of them,
    # `SettingsServiceProvider::boot()`, calls `Schema::hasTable('system_settings')`.
    # With no `.env`, `config/database.php` defaults to `mysql` and the runner has no
    # MySQL, so the install step fails before a single test runs. These variables are
    # real environment variables, and Laravel's Dotenv does not overwrite them, so they
    # answer `hasTable()` with `false` over an in-memory database and need no service.
    #
    # The `backend` job reuses this block through a YAML alias. Both jobs need the same
    # database-less environment, and a drift between two hand-maintained copies is
    # exactly the kind of thing that reads like a corpus failure.
    env: &test-env
      APP_KEY: 'base64:2fl+KtvkdphvQyEfmNqD2aE7nKj8vR3xW5yZ1aB4cD8='
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      # PHPStan boots the app through Larastan. Without a JWT secret the guard
      # extension is absent and `JWTAuth::parser()` analyses as an undefined static
      # method — three findings that do not exist locally, so the committed
      # baseline stops matching. PHPUnit sets its own value; analysis does not.
      JWT_SECRET: 'ci-static-analysis-secret-with-enough-length'
      # Collision truncates test names and finding messages to the terminal width, and
      # the runner's default is 80 columns — the log then reads `file_get_contents(/ho…`
      # instead of the path that failed. This gate exists to produce readable findings.
      COLUMNS: '200'

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # 8.4, not 8.3: `composer.json` requires `^8.4`, and so do the locked
          # `silverspoonmedia/pdf-tools` (dev-main) and `symfony/*` 8.1, so
          # `composer install` refuses to resolve the lock file on 8.3. The local
          # toolchain is 8.4.20, so this matches the machine the lock was built on.
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, bcmath, gd, zip, exif, curl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # This repo does not commit `.env` (gitignored) and CI never creates one, so
      # `LoadEnvironmentVariables` asks phpdotenv for a missing file on every test that
      # boots the app. `safeLoad()` swallows the failure, but PHPUnit still reports the
      # suppressed read as a warning — 36 of them, one per test, which buries the four
      # `skipped` cross-repo guards in noise. An empty file is enough: every value the
      # suite needs comes from phpunit.xml or the job `env:` above, and Laravel's dotenv
      # repository is immutable, so a real `.env` could not override them anyway.
      - name: Create empty .env
        run: php -r "file_put_contents('.env', '');"

      # `LocaleGuardTest` shells out to each guard in `scripts/` and asserts exit 0.
      # The four cross-repo ones report as skipped here rather than passing silently.
      - name: Localization tests (incl. guard gate)
        run: php artisan test --filter=Locale

      # Run the sibling-free guards directly as well: their output names the offending
      # key and locale, which the aggregated PHPUnit failure does not surface in the
      # job log. `locale-dynamic-key-check.php` needs `vendor/autoload.php` (it reflects
      # over the `NotificationType` enum and `ErrorLog` constants), which the install
      # step above provides.
      - name: Guards (direct run, for readable findings)
        run: |
          php scripts/locale-flat-pack-parity.php
          php scripts/locale-dynamic-key-check.php
          php scripts/locale-curation-flag-scan.php

  backend:
    name: Backend suite (sqlite in-memory)
    runs-on: ubuntu-latest
    env: *test-env

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # Same pin as the `locale` job, for the same reason: `composer.json` requires
          # `^8.4` and the lock resolves `symfony/*` 8.1, so 8.3 cannot install the lock.
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, bcmath, gd, zip, exif, curl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # Same reason as the `locale` job: without a file, every app-booting test reports
      # a suppressed phpdotenv read as a warning, which buries real failures. Values come
      # from `phpunit.xml` and the job `env:` above, and Laravel's dotenv repository is
      # immutable, so a real `.env` could not override them anyway.
      - name: Create empty .env
        run: php -r "file_put_contents('.env', '');"

      # Formatting is now a gate, not a courtesy: the whole tree was Pint-clean on
      # 2026-11-19, so `--test` fails only on a diff that introduced drift. Runs before
      # PHPStan so a style failure is reported first.
      - name: Pint (formatting)
        run: vendor/bin/pint --test

      # Larastan boots the app, so the same environment the suite uses is what makes a
      # local baseline match the runner's. `--memory-limit` is above the CLI default;
      # level 5 over the whole analysed surface needs it.
      - name: PHPStan (level 5)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      # The whole suite, not a testsuite subset: `tests/Unit`, `tests/Feature`, and
      # `tests/Domain` all boot the same app, and `--testsuite=Domain` alone would leave
      # the unit/feature halves — including `LocaleGuardTest` — unguarded on the runner.
      # The suite runs against `sqlite :memory:` with `BROADCAST_CONNECTION=null` (set in
      # `phpunit.xml`), so it needs no service: no MySQL, no Redis, no queue worker.
      - name: Backend test suite
        run: php artisan test

  # The one check that proves a package's published toolchain works: copy
  # `packages/{slug}` to a temporary directory, resolve `silverspoonmedia/*` from
  # the sibling sources, `composer install`, `composer test`. Without it a package
  # can green the monolith's suite while a consumer who clones its mirror tag
  # cannot run a single test — the exact debt the Testbench harness closed.
  #
  # Scheduled on the same triggers as the rest, because a Composer install per
  # package is minutes of network; path filters would let a change to
  # `packages/platform/src` skip it while still changing what the siblings resolve.
  standalone-packages:
    name: Standalone package suites
    runs-on: ubuntu-latest
    env: *test-env

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, bcmath, gd, zip, exif, curl
          tools: composer:v2
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # Each package installs its own `require` + `require-dev` (Laravel, Testbench,
      # the sibling kernel) into its temporary copy, so the copy's PHP needs the same
      # extensions the suite does.
      - name: Standalone package suites
        run: composer test:standalone

      # The packages each pass alone; this proves the template assembles them.
      # `run-consumer-scaffold-check.php` copies `client-scaffold`, swaps the private
      # VCS mirrors for path repositories to `packages/*`, installs, lists domains and
      # routes, migrates on sqlite, and asserts one real 422 carries a translated
      # sentence. It shares the install above, so it costs minutes, not more.
      - name: Consumer scaffold
        run: php -d memory_limit=1G scripts/run-consumer-scaffold-check.php
