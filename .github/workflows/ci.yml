name: CI

# Localization gate. This workflow runs only the checks that need **one** repo, so it
# carries no credentials: no cross-repo token, no sibling checkout.
#
# An earlier version checked out `monolith-vue-workers` as a sibling so the four
# cross-repo guards (`locale-prose-scan`, `locale-rawkey-scan`, `locale-pack-parity`,
# `locale-glossary-scan`) could run here too. It never worked: the sibling is private,
# `GITHUB_TOKEN` is scoped to the repo running the workflow, and the checkout step
# failed `Not Found` before any test executed. Reading the sibling needs a fine-grained
# PAT, and the guards still are not the whole story — see the coverage table in
# `docs/platform/localization.md`. Those four now run from a machine that has both
# repos, via `php artisan test --filter=Locale`.
#
# What runs here is the sibling-free half: key/placeholder parity across locales,
# literal call-site resolution, the flat pack against its PHP owners, and the
# runtime-assembled keys. `LocaleGuardTest` reports the four cross-repo guards as
# skipped when the sibling is absent, so a green run cannot be mistaken for "all six
# guards ran".

on:
  push:
    branches: [main, master, main-sandbox, main-staging]
  pull_request:

jobs:
  locale:
    name: Localization guards (sibling-free)
    runs-on: ubuntu-latest

    # `composer install` is not a passive download here: `post-autoload-dump` runs
    # `artisan package:discover`, which boots every service provider. One of them,
    # `SettingsServiceProvider::boot()`, calls `Schema::hasTable('system_settings')`.
    # With no `.env`, `config/database.php` defaults to `mysql` and the runner has no
    # MySQL, so the install step fails before a single test runs. These variables are
    # real environment variables, and Laravel's Dotenv does not overwrite them, so they
    # answer `hasTable()` with `false` over an in-memory database and need no service.
    env:
      APP_KEY: 'base64:2fl+KtvkdphvQyEfmNqD2aE7nKj8vR3xW5yZ1aB4cD8='
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, bcmath, gd, zip, exif, curl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # `LocaleGuardTest` shells out to each guard in `scripts/` and asserts exit 0.
      # The four cross-repo ones report as skipped here rather than passing silently.
      - name: Localization tests (incl. guard gate)
        run: php artisan test --filter=Locale

      # Run the sibling-free guards directly as well: their output names the offending
      # key and locale, which the aggregated PHPUnit failure does not surface in the
      # job log. `locale-dynamic-key-check.php` needs `vendor/autoload.php` (it reflects
      # over the `NotificationType` enum and `ErrorLog` constants), which the install
      # step above provides.
      - name: Guards (direct run, for readable findings)
        run: |
          php scripts/locale-flat-pack-parity.php
          php scripts/locale-dynamic-key-check.php
